<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanka Studio — Kannada ASCII ↔ Unicode Converter</title>
    <meta name="description" content="Sanka Studio: Free Kannada ASCII, Nudi and Baraha to Unicode converter and Unicode to ASCII converter."/>
    
    <link href="static/fav.png" rel="icon" type="image/png" />
    <link rel="apple-touch-icon" href="static/fav.png" />
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="static/styles.css" />
    
    <!-- Original Conversion Engine -->
    <script src="static/kn.js"></script>
    <!-- New UI and Wrapper -->
    <script src="static/converter.js"></script>
    <script src="static/ui.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <img src="static/logo.png" alt="Sanka Studio Logo" class="brand-logo" />
            <div class="brand-title">Sanka Studio<span class="brand-subtitle">Kannada ASCII ↔ Unicode Converter</span></div>
        </div>
        <div class="header-controls">
            <select id="langSelect" class="control-select" aria-label="Language">
                <option value="en">English</option>
                <option value="kn">ಕನ್ನಡ</option>
            </select>
            <select id="themeSelect" class="control-select" aria-label="Theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="system">System</option>
            </select>
        </div>
    </header>

    <main class="main-content">
        <div class="mode-switcher">
            <div class="segment-control" role="group" aria-label="Conversion Mode">
                <button id="btnA2U" class="segment-btn active">ASCII → Unicode</button>
                <button id="btnU2A" class="segment-btn">Unicode → ASCII</button>
            </div>
        </div>

        <div class="workspace">
            <!-- Input Panel -->
            <div class="panel input-panel">
                <div class="panel-header">
                    <span id="inputPanelTitle" class="panel-title">Input</span>
                    <span id="inputStats" class="panel-stats">0 characters · 0 words</span>
                </div>
                <div class="panel-body">
                    <textarea id="inputText" class="editor-textarea" placeholder="Type or paste your text here..." aria-label="Input Text"></textarea>
                </div>
                <div class="panel-actions">
                    <button id="btnPaste" class="btn btn-secondary">
                        <svg class="icon"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg> <span id="pasteBtnText">Paste</span>
                    </button>
                    <button id="btnClear" class="btn btn-secondary">
                        <svg class="icon"><path d="M18 6L6 18M6 6l12 12"></path></svg> <span id="clearBtnText">Clear</span>
                    </button>
                </div>
            </div>

            <!-- Output Panel -->
            <div class="panel output-panel">
                <div class="panel-header">
                    <span id="outputPanelTitle" class="panel-title">Output</span>
                    <span id="outputStats" class="panel-stats">0 characters · 0 words</span>
                </div>
                <div class="panel-body">
                    <textarea id="outputText" class="editor-textarea" placeholder="Converted text will appear here" readonly aria-label="Converted Text"></textarea>
                </div>
                <div class="panel-actions">
                    <button id="btnCopy" class="btn btn-primary">
                        <svg class="icon"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> <span id="copyBtnText">Copy</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        Open-source conversion core based on <a href="https://aravindavk.in/sanka/" target="_blank" rel="noopener">Sanka</a> by Aravind V K · GPLv3
    </footer>
</body>
</html>
